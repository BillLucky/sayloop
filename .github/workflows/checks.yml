name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: pip install -c requirements.lock fastapi python-multipart soundfile numpy pytest httpx ruff
      - run: python -m pytest -q
      - run: ruff check app scripts tests && ruff format --check app scripts tests
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python scripts/privacy_check.py --history
