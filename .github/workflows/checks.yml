name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -c requirements.lock fastapi python-multipart soundfile numpy pytest httpx ruff
      - run: python -m pytest -q
      - run: ruff check app scripts tests && ruff format --check app scripts tests
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run format:check
      - run: python scripts/privacy_check.py
